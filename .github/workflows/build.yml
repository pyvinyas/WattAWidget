name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: Package
        id: pkg
        shell: powershell
        run: |
          $ver = (Get-Item bin\WattAWidget.exe).VersionInfo.FileVersion -replace '\.0$',''
          $zip = "WattAWidget-$ver-win-x64.zip"
          Compress-Archive -Path bin\WattAWidget.exe, README.md, LICENSE, THIRD-PARTY-NOTICES.md -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT
          Get-FileHash $zip -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: WattAWidget
          path: ${{ steps.pkg.outputs.zip }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.zip }}
            bin/WattAWidget.exe
          generate_release_notes: true

  # Submits the version update to microsoft/winget-pkgs automatically.
  # Requires: repo secret WINGET_TOKEN = classic PAT with public_repo scope.
  # Note: only works after the package's initial PR has been merged, since
  # wingetcreate derives the update from the published manifests.
  winget:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Submit winget update
        shell: powershell
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $url = "https://github.com/pyvinyas/WattAWidget/releases/download/v$ver/WattAWidget-$ver-win-x64.zip"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update Vinyas.WattAWidget --version $ver --urls $url --submit --token "${{ secrets.WINGET_TOKEN }}"
